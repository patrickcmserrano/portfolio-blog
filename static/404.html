<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Redirecionando...</title>
		<script>
			// Remove qualquer hash ou query string da URL
			const path = window.location.pathname;
			const base = '/svelte-portfolio-blog';

			// Se já estiver na URL base, redireciona para a raiz
			if (path === base || path === base + '/') {
				window.location.href = base + '/';
			} else {
				// Tenta manter o caminho após o base path
				const relativePath = path.replace(base, '');
				window.location.href = base + relativePath;
			}
		</script>
	</head>
	<body>
		<p>
			Se não for redirecionado automaticamente, <a href="/svelte-portfolio-blog/">clique aqui</a>.
		</p>
	</body>
</html>
