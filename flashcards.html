		<script>
			(function() {
				// Skeleton UI stores modeCurrent as boolean true/false (not string)
				const storedTheme = localStorage.getItem('modeCurrent');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				
				// Parse stored value: could be 'true', 'false', true, false, or null
				let shouldBeDark;
				if (storedTheme === null || storedTheme === undefined) {
					// No preference stored, use system preference or default to true (dark)
					shouldBeDark = prefersDark !== false; // Default to dark if no system preference
					// Store the initial preference
					localStorage.setItem('modeCurrent', String(shouldBeDark));
				} else {
					// Parse the stored value (handles both string and boolean)
					shouldBeDark = storedTheme === 'true' || storedTheme === true;
				}
				
				console.log('[Theme Init] storedTheme:', storedTheme);
				console.log('[Theme Init] prefersDark:', prefersDark);
				console.log('[Theme Init] shouldBeDark:', shouldBeDark);
				
				if (shouldBeDark) {
					document.documentElement.classList.add('dark');
					console.log('[Theme Init] Applied dark class');
				} else {
					document.documentElement.classList.remove('dark');
					console.log('[Theme Init] Removed dark class');
				}
			})();
		</script>

			<script type="application/json" data-sveltekit-fetched data-url="/portfolio-blog/flashcards/functional-programming-fundamentals.json">{"status":200,"statusText":"","headers":{},"body":"{\n  \"id\": \"functional-programming-fundamentals\",\n  \"i18n\": {\n    \"pt\": {\n      \"title\": \"Fundamentos de Programação Funcional\",\n      \"description\": \"Conceitos e princípios fundamentais de programação funcional com exemplos práticos.\"\n    },\n    \"en\": {\n      \"title\": \"Functional Programming Fundamentals\",\n      \"description\": \"Core concepts and principles of functional programming with practical examples.\"\n    }\n  },\n  \"category\": \"Programming Paradigms\",\n  \"language\": \"en\",\n  \"tags\": [\n    \"FP\",\n    \"Functional Programming\",\n    \"Programming Paradigms\",\n    \"Core Concepts\"\n  ],\n  \"cardCount\": 20,\n  \"cards\": [\n    {\n      \"id\": \"fp-01\",\n      \"tags\": [\n        \"Pure Functions\",\n        \"Core Concepts\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é uma função pura em PF?\",\n          \"back\": \"Função determinística: mesmas entradas → mesmas saídas, sem efeitos colaterais (ex: sem I/O, mutações). Ex: `add(x, y) = x + y`. Habilita previsibilidade e testes.\"\n        },\n        \"en\": {\n          \"front\": \"What is a pure function in FP?\",\n          \"back\": \"Deterministic function: same inputs → same outputs, no side effects (e.g., no I/O, mutations). Ex: `add(x, y) = x + y`. Enables predictability & testing.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-02\",\n      \"tags\": [\n        \"Referential Transparency\",\n        \"Theory\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina transparência referencial.\",\n          \"back\": \"Expressão substituível pelo seu valor sem alterar o comportamento do programa. Ligada à pureza. Ex: Substitua `add(2,3)` por `5` em qualquer lugar. Auxilia refatoração e otimização.\"\n        },\n        \"en\": {\n          \"front\": \"Define referential transparency.\",\n          \"back\": \"Expression replaceable by its value without changing program behavior. Tied to purity. Ex: Replace `add(2,3)` with `5` anywhere. Aids refactoring & optimization.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-03\",\n      \"tags\": [\n        \"Immutability\",\n        \"Data Structures\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é imutabilidade em PF?\",\n          \"back\": \"Dados não podem mudar após criação; novos valores são criados em vez disso. Reduz bugs e suporta concorrência. Ex: Em Clojure, `(assoc {:a 1} :b 2)` retorna novo mapa.\"\n        },\n        \"en\": {\n          \"front\": \"What is immutability in FP?\",\n          \"back\": \"Data can't change after creation; new values created instead. Reduces bugs & supports concurrency. Ex: In Clojure, `(assoc {:a 1} :b 2)` returns new map.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-04\",\n      \"tags\": [\n        \"Composition\",\n        \"Modularity\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Explique composicionalidade em PF.\",\n          \"back\": \"Construir programas combinando funções menores algebricamente. Promove modularidade. Ex: `compose(f, g)(x) = f(g(x))`. Como piping em Clojure: `(comp inc #(* % %))`.\"\n        },\n        \"en\": {\n          \"front\": \"Explain compositionality in FP.\",\n          \"back\": \"Building programs by combining smaller functions algebraically. Promotes modularity. Ex: `compose(f, g)(x) = f(g(x))`. Like piping in Clojure: `(comp inc #(* % %))`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-05\",\n      \"tags\": [\n        \"Determinism\",\n        \"Predictability\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que significa determinismo em PF?\",\n          \"back\": \"Computações previsíveis, sem fatores externos (ex: tempo, aleatoriedade em funções puras). Habilita memoização. Ex: Funções puras sempre consistentes vs geradores aleatórios.\"\n        },\n        \"en\": {\n          \"front\": \"What does determinism mean in FP?\",\n          \"back\": \"Computations predictable, no external factors (e.g., time, randomness in pure funcs). Enables memoization. Ex: Pure funcs always consistent vs. random generators.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-06\",\n      \"tags\": [\n        \"Side Effects\",\n        \"Monads\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como PF lida com efeitos colaterais?\",\n          \"back\": \"Minimizar/isolá-los (ex: via mônadas) para manter núcleo puro. Reduz complexidade. Ex: Mônada IO do Haskell encapsula ações impuras como impressão.\"\n        },\n        \"en\": {\n          \"front\": \"How does FP handle side effects?\",\n          \"back\": \"Minimize/isolate them (e.g., via monads) to keep core pure. Reduces complexity. Ex: Haskell's IO monad encapsulates impure actions like printing.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-07\",\n      \"tags\": [\n        \"First-Class Functions\",\n        \"Higher-Order\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são funções de primeira classe?\",\n          \"back\": \"Funções como valores: atribuíveis, passáveis, retornáveis. Base para abstrações. Ex: JS: `const add = (x,y) => x+y; funcArg(add)`.\"\n        },\n        \"en\": {\n          \"front\": \"What are first-class functions?\",\n          \"back\": \"Functions as values: assignable, passable, returnable. Basis for abstractions. Ex: JS: `const add = (x,y) => x+y; funcArg(add)`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-08\",\n      \"tags\": [\n        \"Higher-Order Functions\",\n        \"Abstractions\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina funções de ordem superior (HOFs).\",\n          \"back\": \"Funções que recebem/retornam outras funções. Ex: `map`, `filter`, `reduce`. JS: `[1,2,3].map(x => x*2)`. Habilita código declarativo.\"\n        },\n        \"en\": {\n          \"front\": \"Define higher-order functions (HOFs).\",\n          \"back\": \"Funcs that take/return other funcs. Ex: `map`, `filter`, `reduce`. JS: `[1,2,3].map(x => x*2)`. Enables declarative code.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-09\",\n      \"tags\": [\n        \"Recursion\",\n        \"Control Flow\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é recursão em PF?\",\n          \"back\": \"Função chama a si mesma para fluxo de controle (vs. loops). Precisa de caso base. Recursão cauda otimiza pilha. Ex: Fatorial: `fact(n) = n==0 ? 1 : n * fact(n-1)`.\"\n        },\n        \"en\": {\n          \"front\": \"What is recursion in FP?\",\n          \"back\": \"Func calls itself for control flow (vs. loops). Needs base case. Tail recursion optimizes stack. Ex: Factorial: `fact(n) = n==0 ? 1 : n * fact(n-1)`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-10\",\n      \"tags\": [\n        \"Currying\",\n        \"Partial Application\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Explique currying.\",\n          \"back\": \"Converter função multi-argumento em sequência de funções de argumento único. Auxilia aplicação parcial. Ex: `add(x,y) → add(x)(y)`. Clojure: Use `partial` para reutilização.\"\n        },\n        \"en\": {\n          \"front\": \"Explain currying.\",\n          \"back\": \"Convert multi-arg func to sequence of single-arg funcs. Aids partial application. Ex: `add(x,y) → add(x)(y)`. Clojure: Use `partial` for reuse.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-11\",\n      \"tags\": [\n        \"Partial Application\",\n        \"Currying\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é aplicação parcial?\",\n          \"back\": \"Fixe alguns argumentos, retorne nova função para o resto. Melhora composição. Ex: `add5 = partial(add, 5); add5(3) = 8`.\"\n        },\n        \"en\": {\n          \"front\": \"What is partial application?\",\n          \"back\": \"Fix some args, return new func for rest. Enhances composition. Ex: `add5 = partial(add, 5); add5(3) = 8`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-12\",\n      \"tags\": [\n        \"Composition\",\n        \"Higher-Order\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina composição de funções.\",\n          \"back\": \"Combine funções: `f ∘ g (x) = f(g(x))`. Constrói complexo a partir de simples. Ex: Clojure `comp`: `(comp str inc) 5 → \\\"6\\\"`.\"\n        },\n        \"en\": {\n          \"front\": \"Define function composition.\",\n          \"back\": \"Combine funcs: `f ∘ g (x) = f(g(x))`. Builds complex from simple. Ex: Clojure `comp`: `(comp str inc) 5 → \\\"6\\\"`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-13\",\n      \"tags\": [\n        \"Lazy Evaluation\",\n        \"Efficiency\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é avaliação lazy (não-estrita)?\",\n          \"back\": \"Compute valores apenas quando necessário. Suporta estruturas infinitas. Ex: Haskell: `take 5 [1..]` evita lista infinita completa. Vs. estrita: calcula antecipadamente.\"\n        },\n        \"en\": {\n          \"front\": \"What is lazy (non-strict) evaluation?\",\n          \"back\": \"Compute values only when needed. Supports infinite structures. Ex: Haskell: `take 5 [1..]` avoids full infinite list. Vs. strict: computes upfront.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-14\",\n      \"tags\": [\n        \"Evaluation Strategy\",\n        \"Performance\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Contraste avaliação estrita com lazy.\",\n          \"back\": \"Calcula todas as expressões imediatamente. Previsível mas menos eficiente para valores não utilizados. Ex: Maioria das linguagens como JS avalia args antes da chamada de função.\"\n        },\n        \"en\": {\n          \"front\": \"Contrast strict evaluation with lazy.\",\n          \"back\": \"Computes all expressions immediately. Predictable but less efficient for unused values. Ex: Most langs like JS evaluate args before func call.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-15\",\n      \"tags\": [\n        \"Type Systems\",\n        \"Static Typing\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Descreva sistemas de tipo de PF.\",\n          \"back\": \"Forte/estático com inferência (ex: Hindley-Milner). Tipos de dados algébricos modelam domínios. Captura erros cedo. Ex: Tipos do Haskell previnem incompatibilidades em tempo de execução.\"\n        },\n        \"en\": {\n          \"front\": \"Describe FP type systems.\",\n          \"back\": \"Strong/static with inference (e.g., Hindley-Milner). Algebraic data types model domains. Catches errors early. Ex: Haskell types prevent runtime mismatches.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-16\",\n      \"tags\": [\n        \"Monads\",\n        \"Side Effects\",\n        \"Abstractions\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são mônadas em PF?\",\n          \"back\": \"Estruturas para lidar com efeitos colaterais puramente (ex: IO, estado). Sequenciam computações. Ex: Mônada Maybe do Haskell para valores opcionais: `Just 5 >>= (\\\\x -> Just (x+1))`.\"\n        },\n        \"en\": {\n          \"front\": \"What are monads in FP?\",\n          \"back\": \"Structures to handle side effects purely (e.g., IO, state). Sequence computations. Ex: Haskell Maybe monad for optional values: `Just 5 >>= (\\\\x -> Just (x+1))`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-17\",\n      \"tags\": [\n        \"Data Structures\",\n        \"Immutability\",\n        \"Performance\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Explique estruturas de dados persistentes.\",\n          \"back\": \"Estruturas imutáveis que \\\"atualizam\\\" eficientemente compartilhando partes antigas. Ops log-time. Ex: Vetores do Clojure: Compartilhamento estrutural para cópias rápidas.\"\n        },\n        \"en\": {\n          \"front\": \"Explain persistent data structures.\",\n          \"back\": \"Immutable structs that efficiently \\\"update\\\" by sharing old parts. Log-time ops. Ex: Clojure vectors: Structural sharing for fast copies.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-18\",\n      \"tags\": [\n        \"Lambda\",\n        \"Anonymous Functions\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são expressões lambda?\",\n          \"back\": \"Funções anônimas para uso único. Concisas. Ex: JS: `x => x + 1`. Base para HOFs.\"\n        },\n        \"en\": {\n          \"front\": \"What are lambda expressions?\",\n          \"back\": \"Anonymous funcs for one-off use. Concise. Ex: JS: `x => x + 1`. Basis for HOFs.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-19\",\n      \"tags\": [\n        \"Folds\",\n        \"Recursion\",\n        \"List Operations\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina folds em PF.\",\n          \"back\": \"Reduz estrutura para valor via recursão. Ex: `foldr (+) 0 [1,2,3] = 6`. Agrega listas.\"\n        },\n        \"en\": {\n          \"front\": \"Define folds in FP.\",\n          \"back\": \"Reduce structure to value via recursion. Ex: `foldr (+) 0 [1,2,3] = 6`. Aggregates lists.\"\n        }\n      }\n    },\n    {\n      \"id\": \"fp-20\",\n      \"tags\": [\n        \"Unfolds\",\n        \"Recursion\",\n        \"List Generation\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são unfolds?\",\n          \"back\": \"Constrói estruturas a partir de sementes via recursão. Ex: Gera lista: `unfoldr (\\\\n -> if n>0 then Just (n, n-1) else Nothing) 5 = [5,4,3,2,1]`.\"\n        },\n        \"en\": {\n          \"front\": \"What are unfolds?\",\n          \"back\": \"Build structures from seeds via recursion. Ex: Generate list: `unfoldr (\\\\n -> if n>0 then Just (n, n-1) else Nothing) 5 = [5,4,3,2,1]`.\"\n        }\n      }\n    }\n  ]\n}"}</script>

: \"TS automatically deduces variable types. Ex: `let x = 5` infers `number`. Reduces boilerplate while maintaining type safety.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-03\",\n      \"tags\": [\n        \"Union Types\",\n        \"Type System\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são tipos union?\",\n          \"back\": \"Variável pode ser um de múltiplos tipos. Ex: `type ID = string | number`. Use quando um valor tem múltiplos tipos válidos.\"\n        },\n        \"en\": {\n          \"front\": \"What are union types?\",\n          \"back\": \"Variable can be one of multiple types. Ex: `type ID = string | number`. Use when a value has multiple valid types.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-04\",\n      \"tags\": [\n        \"Intersection Types\",\n        \"Type Composition\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina tipos intersection.\",\n          \"back\": \"Combina múltiplos tipos em um. Ex: `type Admin = User & { role: 'admin' }`. Objeto deve satisfazer todos os tipos combinados.\"\n        },\n        \"en\": {\n          \"front\": \"Define intersection types.\",\n          \"back\": \"Combines multiple types into one. Ex: `type Admin = User & { role: 'admin' }`. Object must satisfy all combined types.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-05\",\n      \"tags\": [\n        \"Generics\",\n        \"Reusability\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são genéricos em TypeScript?\",\n          \"back\": \"Componentes reutilizáveis para múltiplos tipos. Ex: `function identity\u003CT>(x: T): T { return x }`. Oferece segurança de tipo com flexibilidade.\"\n        },\n        \"en\": {\n          \"front\": \"What are generics in TypeScript?\",\n          \"back\": \"Reusable components for multiple types. Ex: `function identity\u003CT>(x: T): T { return x }`. Provides type safety with flexibility.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-06\",\n      \"tags\": [\n        \"Interfaces\",\n        \"Types\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Explique interfaces vs types.\",\n          \"back\": \"Ambos definem formas. Interfaces: extensíveis, melhor para OOP. Types: flexíveis, suportam unions e tuplas. Escolha depende do caso de uso.\"\n        },\n        \"en\": {\n          \"front\": \"Explain interfaces vs types.\",\n          \"back\": \"Both define shapes. Interfaces: extensible, best for OOP. Types: flexible, support unions & tuples. Choice depends on use case.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-07\",\n      \"tags\": [\n        \"Enums\",\n        \"Constants\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são enums em TypeScript?\",\n          \"back\": \"Constantes nomeadas para código legível. Ex: `enum Color { Red, Green, Blue }`. Podem ser numéricas ou baseadas em string.\"\n        },\n        \"en\": {\n          \"front\": \"What are enums in TypeScript?\",\n          \"back\": \"Named constants for readable code. Ex: `enum Color { Red, Green, Blue }`. Can be numeric or string-based.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-08\",\n      \"tags\": [\n        \"Conditional Types\",\n        \"Advanced Types\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina tipos condicionais.\",\n          \"back\": \"Tipos que dependem de condições. Ex: `T extends string ? T : never`. Recurso avançado para transformações de tipo.\"\n        },\n        \"en\": {\n          \"front\": \"Define conditional types.\",\n          \"back\": \"Types that depend on conditions. Ex: `T extends string ? T : never`. Advanced feature for type transformations.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-09\",\n      \"tags\": [\n        \"Mapped Types\",\n        \"Advanced Types\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são tipos mapeados?\",\n          \"back\": \"Transformam tipos existentes em novos. Ex: `type Readonly\u003CT> = { readonly [K in keyof T]: T[K] }`. Abstração poderosa.\"\n        },\n        \"en\": {\n          \"front\": \"What are mapped types?\",\n          \"back\": \"Transform existing types into new ones. Ex: `type Readonly\u003CT> = { readonly [K in keyof T]: T[K] }`. Powerful abstraction.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-10\",\n      \"tags\": [\n        \"Utility Types\",\n        \"Built-ins\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Explique tipos utilitários.\",\n          \"back\": \"Tipos built-in para transformações: `Partial`, `Required`, `Pick`, `Omit`, `Record`. Reduzem duplicação de código.\"\n        },\n        \"en\": {\n          \"front\": \"Explain utility types.\",\n          \"back\": \"Built-in types for transformations: `Partial`, `Required`, `Pick`, `Omit`, `Record`. Reduce code duplication.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-11\",\n      \"tags\": [\n        \"any Type\",\n        \"Type Safety\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é o tipo `any`?\",\n          \"back\": \"Escapa da verificação de tipo; use raramente. Derrota o propósito de TS. Prefira `unknown` (mais seguro) ou tipos específicos.\"\n        },\n        \"en\": {\n          \"front\": \"What is the `any` type?\",\n          \"back\": \"Escapes type checking; use sparingly. Defeats TS purpose. Prefer `unknown` (safer) or specific types.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-12\",\n      \"tags\": [\n        \"never Type\",\n        \"Advanced Types\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Explique o tipo `never`.\",\n          \"back\": \"Nenhum valor pode ter tipo `never`. Usado para código inalcançável ou verificações exaustivas. Ex: instruções throw.\"\n        },\n        \"en\": {\n          \"front\": \"Explain the `never` type.\",\n          \"back\": \"No value can have type `never`. Used for unreachable code or exhaustive checks. Ex: throw statements.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-13\",\n      \"tags\": [\n        \"Function Overloads\",\n        \"Functions\"\n      ],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são sobrecargas de função?\",\n          \"back\": \"Defina múltiplas assinaturas para a mesma função. Ex: `add(x:number, y:number) → number` vs `add(x:string, y:string) → string`.\"\n        },\n        \"en\": {\n          \"front\": \"What are function overloads?\",\n          \"back\": \"Define multiple signatures for same function. Ex: `add(x:number, y:number) → number` vs `add(x:string, y:string) → string`.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-14\",\n      \"tags\": [\n        \"Classes\",\n        \"Encapsulation\"\n      ],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Defina modificadores de acesso de classe.\",\n          \"back\": \"`public` (padrão), `private` (apenas classe), `protected` (classe e subclasses). Controla encapsulamento.\"\n        },\n        \"en\": {\n          \"front\": \"Define class access modifiers.\",\n          \"back\": \"`public` (default), `private` (class only), `protected` (class & subclasses). Control encapsulation.\"\n        }\n      }\n    },\n    {\n      \"id\": \"ts-15\",\n      \"tags\": [\n        \"Decorators\",\n        \"Advanced Features\"\n      ],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são decoradores em TypeScript?\",\n          \"back\": \"Recurso experimental para anotação de classe/método. Ex: `@Component` em Angular. Habilita metaprogramação.\"\n        },\n        \"en\": {\n          \"front\": \"What are decorators in TypeScript?\",\n          \"back\": \"Experimental feature for class/method annotation. Ex: `@Component` in Angular. Enables metaprogramming.\"\n        }\n      }\n    }\n  ]\n}"}</script>
			<script type="application/json" data-sveltekit-fetched data-url="/portfolio-blog/flashcards/clojure-essentials.json">{"status":200,"statusText":"","headers":{},"body":"{\n  \"id\": \"clojure-essentials\",\n  \"i18n\": {\n    \"pt\": {\n      \"title\": \"Essenciais de Clojure\",\n      \"description\": \"Aprenda os fundamentos e conceitos avançados de Clojure, de sintaxe básica até macros e concorrência.\"\n    },\n    \"en\": {\n      \"title\": \"Clojure Essentials\",\n      \"description\": \"Learn Clojure fundamentals and advanced concepts, from basic syntax to macros and concurrency.\"\n    }\n  },\n  \"category\": \"Functional Languages\",\n  \"language\": \"en\",\n  \"tags\": [\"Clojure\", \"Lisp\", \"JVM\", \"Functional Programming\", \"Advanced\"],\n  \"cardCount\": 31,\n  \"cards\": [\n    {\n      \"id\": \"clj-01\",\n      \"tags\": [\"Basics\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Por que Clojure?\",\n          \"back\": \"Clojure é um Lisp moderno na JVM, enfatizando programação funcional, dados imutáveis, suporte a concorrência e interop com Java para apps robustas e escaláveis.\"\n        },\n        \"en\": {\n          \"front\": \"Why Clojure?\",\n          \"back\": \"Clojure is a modern Lisp on the JVM, emphasizing functional programming, immutable data, concurrency support, and Java interop for robust, scalable apps.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-02\",\n      \"tags\": [\"Setup\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como obter Clojure?\",\n          \"back\": \"Baixe o JAR do Clojure em clojure.org; use ferramentas como Leiningen ou Boot para configuração, dependências e lançamento do REPL em projetos.\"\n        },\n        \"en\": {\n          \"front\": \"Obtaining Clojure\",\n          \"back\": \"Download Clojure JAR from clojure.org; use tools like Leiningen or Boot for setup, dependencies, and REPL launch in projects.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-03\",\n      \"tags\": [\"REPL\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é o Clojure REPL?\",\n          \"back\": \"Shell interativo (Read-Eval-Print Loop) para execução, teste e exploração de código em tempo real; inicie com 'java -jar clojure.jar'.\"\n        },\n        \"en\": {\n          \"front\": \"The Clojure REPL\",\n          \"back\": \"Interactive shell (Read-Eval-Print Loop) for real-time code execution, testing, and exploration; start with 'java -jar clojure.jar'.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-04\",\n      \"tags\": [\"Syntax\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Parênteses no Clojure realmente causam cegueira?\",\n          \"back\": \"O uso intenso de parênteses no Clojure é para estrutura, não obstáculo; eles permitem homoiconicidade e macros, tornando-se intuitivos com o uso.\"\n        },\n        \"en\": {\n          \"front\": \"No, Parentheses Actually Won't Make You Go Blind\",\n          \"back\": \"Clojure's heavy use of parentheses is for structure, not hindrance; they enable homoiconicity and macros, becoming intuitive with use.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-05\",\n      \"tags\": [\"Syntax\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Expressões, Operadores, Sintaxe e Precedência\",\n          \"back\": \"Todo código Clojure é expressões em notação prefixada (op args); sem regras de precedência—parênteses ditam a ordem para clareza e consistência.\"\n        },\n        \"en\": {\n          \"front\": \"Expressions, Operators, Syntax, and Precedence\",\n          \"back\": \"All Clojure code is expressions in prefix notation (op args); no precedence rules—parentheses dictate order for clarity and consistency.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-06\",\n      \"tags\": [\"Metaprogramming\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é homoiconicidade?\",\n          \"back\": \"Código Clojure usa estruturas de dados (listas, vetores) diretamente como ASTs, permitindo metaprogramação fácil como macros; ao contrário da maioria das linguagens com árvores de sintaxe ocultas.\"\n        },\n        \"en\": {\n          \"front\": \"Homoiconicity\",\n          \"back\": \"Clojure code uses data structures (lists, vectors) directly as ASTs, enabling easy metaprogramming like macros; unlike most languages with hidden syntax trees.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-07\",\n      \"tags\": [\"Reader\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é o Leitor (Reader) do Clojure?\",\n          \"back\": \"Leitor do Clojure (read/read-string) desserializa texto em estruturas de dados/valores; pr/pr-str serializa de volta; suporta formatos legíveis para código-como-dados.\"\n        },\n        \"en\": {\n          \"front\": \"The Reader\",\n          \"back\": \"Clojure's reader (read/read-string) deserializes text into data structures/values; pr/pr-str serializes back; supports human-readable formats for code-as-data.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-08\",\n      \"tags\": [\"Data Types\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são Literais Escalares?\",\n          \"back\": \"Valores não-coleção como strings (\\\"hello\\\"), booleanos (true/false), nil, caracteres (\\\\c), keywords (:key), símbolos (sym), números (42/3.14/0xFF), regex (#\\\"pat\\\"); permitem representações precisas.\"\n        },\n        \"en\": {\n          \"front\": \"Scalar Literals\",\n          \"back\": \"Non-collection values like strings (\\\"hello\\\"), booleans (true/false), nil, characters (\\\\c), keywords (:key), symbols (sym), numbers (42/3.14/0xFF), regex (#\\\"pat\\\"); enable precise representations.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-09\",\n      \"tags\": [\"Syntax\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como fazer comentários em Clojure?\",\n          \"back\": \"Ponto e vírgula (;) para comentários de linha; #_ para pular próxima forma (ex.: #_(println \\\"pular\\\")); macro comment retorna nil mas não elide formas.\"\n        },\n        \"en\": {\n          \"front\": \"Comments\",\n          \"back\": \"Semicolon (;) for line comments; #_ to skip next form (e.g., #_(println \\\"skip\\\")); comment macro returns nil but doesn't elide forms.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-10\",\n      \"tags\": [\"Syntax\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O papel do espaço em branco e vírgulas em Clojure\",\n          \"back\": \"Espaço em branco separa formas/valores; vírgulas (,) tratadas como espaço em branco, opcionais para legibilidade (ex.: {:a 1, :b 2}).\"\n        },\n        \"en\": {\n          \"front\": \"Whitespace and Commas\",\n          \"back\": \"Whitespace separates forms/values; commas (,) treated as whitespace, optional for readability (e.g., {:a 1, :b 2}).\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-11\",\n      \"tags\": [\"Data Structures\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são Literais de Coleção?\",\n          \"back\": \"Listas '(a b), vetores [1 2], mapas {:k \\\"v\\\"}, sets #{1 2}; quote (') previne avaliação de listas como chamadas.\"\n        },\n        \"en\": {\n          \"front\": \"Collection Literals\",\n          \"back\": \"Lists '(a b), vectors [1 2], maps {:k \\\"v\\\"}, sets #{1 2}; quote (') prevents list evaluation as calls.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-12\",\n      \"tags\": [\"Syntax\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é açúcar sintático diverso do Leitor?\",\n          \"back\": \"Atalhos de sintaxe: quote ('), fn anôn #(), var #', deref @, macros (` ~ ~@), interop (. new), metadados (^); melhoram concisão.\"\n        },\n        \"en\": {\n          \"front\": \"Miscellaneous Reader Sugar\",\n          \"back\": \"Syntax shortcuts: quote ('), anon fn #(), var #', deref @, macros (` ~ ~@), interop (. new), metadata (^); enhance concision.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-13\",\n      \"tags\": [\"Namespaces\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são Namespaces em Clojure?\",\n          \"back\": \"Organizam símbolos/vars; símbolos avaliam para valores no namespace atual; use / para nomes qualificados, :: para auto-namespacing.\"\n        },\n        \"en\": {\n          \"front\": \"Namespaces\",\n          \"back\": \"Organize symbols/vars; symbols evaluate to values in current namespace; use / for qualified names, :: for auto-namespaced.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-14\",\n      \"tags\": [\"Evaluation\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como funcionam os Símbolos?\",\n          \"back\": \"Símbolos avaliam para valores de var/local; na posição de função, resolvem para funções, vars ou formas especiais (precedência para formas especiais). Ex.: /, apply referem a vars em clojure.core em chamadas.\"\n        },\n        \"en\": {\n          \"front\": \"Symbol Evaluation\",\n          \"back\": \"Symbols evaluate to var/local values; in function position, resolve to functions, vars, or special forms (precedence to special forms). E.g., /, apply refer to clojure.core vars in calls.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-15\",\n      \"tags\": [\"Special Forms\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são Formas Especiais?\",\n          \"back\": \"Blocos primitivos de computação do Clojure; conjunto limitado com sintaxe/semântica únicas, ex.: quote, do, def. Base para todo Clojure; suficiente para qualquer computação, ao contrário de primitivas da maioria das linguagens.\"\n        },\n        \"en\": {\n          \"front\": \"Special Forms\",\n          \"back\": \"Clojure's primitive computation blocks; limited set with unique syntax/semantics, e.g., quote, do, def. Foundation for all Clojure; sufficient for any computation, unlike most languages' primitives.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-16\",\n      \"tags\": [\"Special Forms\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como suprimir avaliação com quote?\",\n          \"back\": \"Suprime avaliação de expressões; símbolos auto-avaliam. Sintaxe do leitor: '. Ex.: (quote x) => x; '(+ x x) => (+ x x). Aplica recursivamente a estruturas de dados.\"\n        },\n        \"en\": {\n          \"front\": \"Suppressing Evaluation: quote\",\n          \"back\": \"Suppresses expression evaluation; symbols self-evaluate. Reader syntax: '. E.g., (quote x) => x; '(+ x x) => (+ x x). Applies recursively to data structures.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-17\",\n      \"tags\": [\"Special Forms\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que faz a forma especial 'do'?\",\n          \"back\": \"Avalia expressões sequencialmente, retorna último valor; descarta resultados anteriores mas retém efeitos colaterais. Implícito em fn, let, etc. Ex.: (do (println \\\"hi\\\") (* 4 5 6)) imprime e retorna 120.\"\n        },\n        \"en\": {\n          \"front\": \"Code Blocks: do\",\n          \"back\": \"Evaluates expressions sequentially, returns last value; discards prior results but retains side effects. Implicit in fn, let, etc. E.g., (do (println \\\"hi\\\") (* 4 5 6)) prints and returns 120.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-18\",\n      \"tags\": [\"Special Forms\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como definir Vars com 'def'?\",\n          \"back\": \"Define/redefine var no namespace atual, valor opcional. Usado por defn, defmacro. Ex.: (def p \\\"foo\\\") => #'user/p. Vars são referências estáveis, não reatribuíveis como variáveis.\"\n        },\n        \"en\": {\n          \"front\": \"Defining Vars: def\",\n          \"back\": \"Defines/redefines var in current namespace, optional value. Used by defn, defmacro. E.g., (def p \\\"foo\\\") => #'user/p. Vars are stable references, not reassignable like variables.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-19\",\n      \"tags\": [\"Special Forms\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que faz a forma especial 'let'?\",\n          \"back\": \"Cria locais imutáveis com escopo léxico via vetor de bindings. Ex.: (let [x 1 y 2] (+ x y)). Implícito em fn para params; habilita destructuring. Todos os locais imutáveis.\"\n        },\n        \"en\": {\n          \"front\": \"Local Bindings: let\",\n          \"back\": \"Creates immutable, lexically scoped locals via binding vector. E.g., (let [x 1 y 2] (+ x y)). Implicit in fn for params; enables destructuring. All locals immutable.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-20\",\n      \"tags\": [\"Data Structures\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que é Destructuring?\",\n          \"back\": \"Bind valores de coleções declarativamente em let; sequencial [x y] para listas/vetores, mapa {a :a} para mapas. Composível; recursos: & rest, :as todo, :or defaults, :keys atalho. Reduz verbosidade.\"\n        },\n        \"en\": {\n          \"front\": \"Destructuring (let, Part 2)\",\n          \"back\": \"Binds collection values declaratively in let; sequential [x y] for lists/vectors, map {a :a} for maps. Composable; features: & rest, :as whole, :or defaults, :keys shorthand. Reduces verbosity.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-21\",\n      \"tags\": [\"Functions\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como criar funções com 'fn'?\",\n          \"back\": \"fn cria funções de primeira classe no Clojure; sintaxe (fn name? [params*] body*). Suporta destructuring em params, multi-aridade, variádicos (&), args keyword. Ex.: (fn [x] (* x x)) para quadrado. Base para defn.\"\n        },\n        \"en\": {\n          \"front\": \"Creating Functions: fn\",\n          \"back\": \"fn creates first-class functions in Clojure; syntax (fn name? [params*] body*). Supports destructuring params, multi-arity, variadics (&), keyword args. E.g., (fn [x] (* x x)) for square. Basis for defn.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-22\",\n      \"tags\": [\"Control Flow\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como usar a forma especial 'if'?\",\n          \"back\": \"Condicional primário do Clojure; (if test then [else]). Avalia 'then' se test truthy (não nil/false), else opcional. Sintaxe simples, sem else-if implícito; use cond/when para complexo. Retorna valor do ramo.\"\n        },\n        \"en\": {\n          \"front\": \"Conditionals: if\",\n          \"back\": \"Clojure's primary conditional; (if test then [else]). Evaluates 'then' if test truthy (not nil/false), else optional. Simple syntax, no implicit else-if; use cond/when for complex. Returns branch value.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-23\",\n      \"tags\": [\"Control Flow\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como implementar loops com 'loop' e 'recur'?\",\n          \"back\": \"loop define ponto de recursão com bindings iniciais; recur rebind args e recursa para loop/fn sem consumo de stack. Permite recursão de cauda eficiente para loops. Ex.: (loop [x 0] (if (\u003C x 10) (recur (inc x)) x)).\"\n        },\n        \"en\": {\n          \"front\": \"Looping: loop and recur\",\n          \"back\": \"loop sets recursion point with initial bindings; recur rebinds args and recurses to loop/fn without stack consumption. Enables efficient tail recursion for loops. E.g., (loop [x 0] (if (\u003C x 10) (recur (inc x)) x)).\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-24\",\n      \"tags\": [\"Variables\"],\n      \"difficulty\": \"medium\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que faz a forma especial 'var'?\",\n          \"back\": \"var sym ou #'sym retorna objeto var, não seu valor. Símbolos avaliam para valores de var; var útil para passar vars a fns de ordem superior ou acesso a metadados. Ex.: (var x) => #'user/x.\"\n        },\n        \"en\": {\n          \"front\": \"Referring to Vars: var\",\n          \"back\": \"var sym or #'sym returns var object, not its value. Symbols evaluate to var values; var useful for passing vars to higher-order fns or metadata access. E.g., (var x) => #'user/x.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-25\",\n      \"tags\": [\"Interop\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como usar Interop Java com '.' e 'new'?\",\n          \"back\": \"Habilita chamadas Java; (. instance method args) para métodos de instância, (. Class staticMethod args) para estáticos; (new Class args) para construtores. Base para todo interop Java; açúcares como dot expandem para esses.\"\n        },\n        \"en\": {\n          \"front\": \"Java Interop: . and new\",\n          \"back\": \"Enables Java calls; (. instance method args) for instance methods, (. Class staticMethod args) for statics; (new Class args) for constructors. Foundation for all Java interop; sugar like dot forms expand to these.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-26\",\n      \"tags\": [\"Error Handling\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como tratar exceções com 'try' e 'throw'?\",\n          \"back\": \"try envolve exprs com cláusulas catch (catch ExceptionType e body) para manipulação, finally opcional para cleanup. throw lança exceções. Integra com sistema de exceções do Java.\"\n        },\n        \"en\": {\n          \"front\": \"Exception Handling: try and throw\",\n          \"back\": \"try wraps exprs with catch clauses (catch ExceptionType e body) for handling, optional finally for cleanup. throw throws exceptions. Integrates with Java's exception system.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-27\",\n      \"tags\": [\"Advanced\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que faz a forma especial 'set!'?\",\n          \"back\": \"Muta bindings de var dynamic thread-local ou campos mutáveis em deftype. Raro no Clojure idiomático; usado para interop, performance ou necessidades de estado mutável específico. Ex.: (set! *warn-on-reflection* true).\"\n        },\n        \"en\": {\n          \"front\": \"Specialized Mutation: set!\",\n          \"back\": \"Mutates thread-local dynamic var bindings or mutable fields in deftype. Rare in idiomatic Clojure; used for interop, performance, or specific mutable state needs. E.g., (set! *warn-on-reflection* true).\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-28\",\n      \"tags\": [\"Concurrency\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que são 'monitor-enter' e 'monitor-exit'?\",\n          \"back\": \"Sincronização de baixo nível em monitores de objetos, como synchronized do Java. Adquire/libera lock; use em try-finally. Prefira ferramentas de concorrência de alto nível como macro locking para segurança.\"\n        },\n        \"en\": {\n          \"front\": \"Primitive Locking: monitor-enter and monitor-exit\",\n          \"back\": \"Low-level synchronization on object monitors, like Java's synchronized. Acquires/releases lock; use in try-finally. Prefer higher-level concurrency tools like locking macro for safety.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-29\",\n      \"tags\": [\"Integration\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Como tudo funciona junto?\",\n          \"back\": \"Integra conceitos analisando (defn average [numbers] (/ (apply + numbers) (count numbers))); defn expande para (def ... (fn ...)); ilustra avaliação completa de dados para definição de função.\"\n        },\n        \"en\": {\n          \"front\": \"Putting It All Together\",\n          \"back\": \"Integrates concepts by analyzing (defn average [numbers] (/ (apply + numbers) (count numbers))); defn expands to (def ... (fn ...)); illustrates full evaluation from data to function definition.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-30\",\n      \"tags\": [\"Advanced\"],\n      \"difficulty\": \"hard\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"O que faz a função 'eval'?\",\n          \"back\": \"Função central que avalia forma como código, incorporando semânticas do Clojure; raramente usada em apps—opte por macros; ex.: (eval '(average [60 80 100 400])) => 160; mostrado em impl REPL simples.\"\n        },\n        \"en\": {\n          \"front\": \"eval\",\n          \"back\": \"Core function evaluating a form as code, embodying Clojure's semantics; rarely used in apps—opt for macros; e.g., (eval '(average [60 80 100 400])) => 160; shown in simple REPL impl.\"\n        }\n      }\n    },\n    {\n      \"id\": \"clj-31\",\n      \"tags\": [\"Learning\"],\n      \"difficulty\": \"easy\",\n      \"i18n\": {\n        \"pt\": {\n          \"front\": \"Isto é apenas o começo\",\n          \"back\": \"Resume bases do Clojure: formas especiais, homoiconicidade, dev REPL; previews imutáveis, concorrência, macros; recomenda recursos: docs API, lista/IRC, site do livro para aprendizado contínuo.\"\n        },\n        \"en\": {\n          \"front\": \"This Is Just the Beginning\",\n          \"back\": \"Summarizes Clojure basics: special forms, homoiconicity, REPL dev; previews immutables, concurrency, macros; recommends resources: API docs, mailing list/IRC, book site for ongoing learning.\"\n        }\n      }\n    }\n  ]\n}\n"}</script>

		<!-- Script de limpeza condicional e detecção de problemas -->
		<script>
			// Detectar se há problemas de service worker e limpar se necessário
			if (window.location.search.includes('clear-cache=true')) {
				const script = document.createElement('script');
				script.src = './clear-cache.js';
				document.head.appendChild(script);
			}
			
			// Detecção automática de problemas comuns
			window.addEventListener('load', function() {
				// Detectar erros de service worker
				let serviceWorkerErrors = 0;
				const originalError = window.console.error;
				window.console.error = function(...args) {
					const message = args.join(' ').toLowerCase();
					if (message.includes('service-worker') || 
						message.includes('could not establish connection') ||
						message.includes('receiving end does not exist')) {
						serviceWorkerErrors++;
						
						// Se muitos erros de service worker, sugerir limpeza
						if (serviceWorkerErrors >= 3) {
							console.warn('🚨 Detectados múltiplos erros de service worker. Considere limpar o cache.');
							console.info('💡 Para limpar o cache, adicione ?clear-cache=true à URL');
						}
					}
					originalError.apply(console, args);
				};
				
				// Verificar se PDFs estão sendo bloqueados
				setTimeout(function() {
					const pdfErrors = document.querySelectorAll('[data-pdf-error]');
					if (pdfErrors.length > 0) {
						console.warn('🚨 Detectados problemas com PDFs. Verifique as configurações do navegador.');
					}
				}, 2000);
			});
		</script>
