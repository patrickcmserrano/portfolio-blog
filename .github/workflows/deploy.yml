name: Deploy SvelteKit to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger no push para a branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # Build usando Docker
      - name: Build com Docker
        run: |
          docker build -t skeleton-portifolio-blog-app-1 .
          docker run --rm -v ${{ github.workspace }}/dist:/output sveltekit-app

      # Deploy para GitHub Pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Diretório com os arquivos gerados