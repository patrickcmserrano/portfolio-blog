version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-development}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
    working_dir: /app
    command: >
      sh -c '
      if [ "$NODE_ENV" = "production" ]; then
        serve -s build -l ${PORT:-3000};
      else
        npm install && npm run dev -- --host 0.0.0.0 --port ${PORT:-3000};
      fi' 